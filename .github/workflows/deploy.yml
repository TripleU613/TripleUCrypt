name: Deploy to server

# Continuous deploy to the Linux host (DigitalOcean droplet, tor1/Toronto).
#
# Replaces the previous self-hosted-Windows-runner deploy: that box is retired,
# and its runner going offline left deploys queued forever rather than failing.
# This runs on a GitHub-hosted runner and reaches the host over SSH.
#
# The host does the work: `tuc-deploy` pulls main via a read-only deploy key,
# rebuilds, restarts, and waits for /health. See deploy/linux/README.md.
#
# The SSH key in DROPLET_SSH_KEY is pinned server-side to a FORCED COMMAND
# (`command="/usr/local/bin/tuc-deploy"` in the host's authorized_keys), so it
# cannot open a shell or forward ports even if it leaks. That is why this job
# just opens a connection and does not pass a command.
#
# Secrets used (repo Settings -> Secrets -> Actions):
#   DROPLET_HOST         host IP / DNS name
#   DROPLET_SSH_KEY      private key whose public half is the forced-command entry
#   DROPLET_KNOWN_HOSTS  ssh-keyscan output, so the host key is pinned not trusted
#
# Money credentials are NOT provisioned from CI. They live only in
# /opt/tripleucrypt/secrets.env on the host (`tuc-secrets`), so a wallet key
# never passes through GitHub.

# Least privilege by default; the gate job opts into the one scope it needs.
permissions: {}

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false   # let a running deploy finish; don't kill it mid-build

jobs:
  # Deploy must not outrun its own tests. deploy.yml has no dependency on ci.yml,
  # and both are triggered by the same push -- so whichever gets a runner first
  # wins. That has already happened in practice: a commit deployed to production
  # while CI was still queued. This gate makes the tests a precondition rather
  # than a race.
  gate:
    name: Test gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # actions/checkout needs this. Without it the workflow-level `permissions: {}`
    # leaves the token with no scopes and checkout fails "Repository not found"
    # (GitHub returns 404, not 403, for a private repo it cannot see) -- which
    # broke every deploy. The deploy job below still gets no token scope: it only
    # opens an SSH connection.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.server.json --noEmit
      - run: npx tsc -p tsconfig.client.json --noEmit
      - run: npx vitest run
      - run: npm run build

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DROPLET_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy (pull, rebuild, restart, wait for health)
        run: |
          # No command argument: the host's forced command runs tuc-deploy, which
          # exits non-zero if the app does not report healthy -- so a failed
          # rollout fails this job.
          ssh -i ~/.ssh/id_ed25519 \
              -o IdentitiesOnly=yes \
              -o ServerAliveInterval=20 \
              -o ConnectTimeout=15 \
              root@${{ secrets.DROPLET_HOST }}

      - name: Report failure
        if: failure()
        run: |
          echo "::error::Deploy failed. The previous container keeps running (restart: unless-stopped)"
          echo "::error::and the previous image is still present, so the app should still be serving."
          echo "::error::Inspect with: ssh root@<host> 'tuc-status' and 'tuc-logs'"
