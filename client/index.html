<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TripleUCrypt</title>
    <meta name="description" content="Fast Polymarket trading client for short-window crypto up/down markets — live charts, one-tap presets, browser-wallet trading." />
    <meta name="theme-color" content="#080808" />
    <meta name="color-scheme" content="dark light" />

    <!-- Critical CSS, inlined deliberately.
         The build emits ZERO .css assets: all ~1000 lines of CSS live in
         client/theme.ts and are injected by injectTheme() from client/main.tsx,
         which means NOTHING paints - not even the page background - until the
         whole ~890 kB JS bundle has downloaded, parsed and executed. On a
         light-preference OS that is a white flash for the entire load.
         Only the background is duplicated here, on purpose: keep both values in sync with
         --tc-bg in client/theme.ts (:36 dark, :157 light). Everything else, including
         the boot overlay itself, stays fully owned by React - a prepainted logo
         would render full-size and then snap to invisible when JS takes over. -->
    <style>
      :root { --tc-bg: #080808; }
      html[data-theme="light"] { --tc-bg: #f4f5f7; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--tc-bg);
        overflow: hidden;
      }
    </style>

    <!-- Icons -->
    <!-- Font preload. The @font-face rules live in client/theme.ts, injected as a
         <style> by main.tsx -- so without these links the browser cannot even
         DISCOVER the fonts until the ~464 kB entry bundle has downloaded, parsed
         and executed. Preloading starts both fetches on the first round trip
         instead, in parallel with the JS. crossorigin is required on font
         preloads or the fetch is made twice. -->
    <link rel="preload" href="/fonts/inter-polymarket.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/orbitron.ttf" as="font" type="font/ttf" crossorigin />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- PWA / iOS standalone -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TripleUCrypt" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TripleUCrypt" />
    <meta property="og:title" content="TripleUCrypt" />
    <meta property="og:description" content="Fast Polymarket trading client for short-window crypto up/down markets." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TripleUCrypt" />
    <meta name="twitter:description" content="Fast Polymarket trading client for short-window crypto up/down markets." />
    <meta name="twitter:image" content="/og-image.png" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
